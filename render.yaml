# The database is deliberately not a Render resource: Render's free Postgres is
# deleted after ~30 days. DATABASE_URL points at a Neon project instead, whose
# free tier has no expiry, so only the web service is described here.
services:
  - type: web
    name: book-review-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python init_db.py
    startCommand: gunicorn run:app
    envVars:
      # sync: false means Render prompts for the value instead of storing it
      # here -- paste the Neon connection string when applying the blueprint
      - key: DATABASE_URL
        sync: false
      # generated by Render and never stored in this repo
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.9"
